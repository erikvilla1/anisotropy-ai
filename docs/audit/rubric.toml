# The coupon audit rubric (ADR-0043): what every audit of a coupon package checks, and what passes.
#
# Read by anisotropy_fea.audit (load_rubric), which refuses a rubric with a missing field, a duplicate or out-of-order item, an
# unknown section, test code or function. The audit chapter of the coupon document and the audit form are built from it, so a
# change here changes every later audit: raise `version` with it.
#
# Each item:
#   id          section letter and number, numbered from 1 in each section; a finding names the item it is about
#   check       what is checked
#   acceptance  what counts as Pass
#   method      "auto": our tools give the result, from the functions in `source`; the auditor may add an observation
#               "auditor": the auditor gives the result; our tools may show evidence
#   required    true: a Pass verdict needs this item to be Pass or N/A; false: a Fail here is an observation, not a Fail verdict
#   source      the anisotropy_fea functions the result comes from ("module.function" or "module.Class.method"); empty while
#               the check is not built, and then the item cannot be required
#   tolerance   { relative = fraction } or { length_m = metres } (SI, ADR-0002)
#   applies_to  the test codes of spec.TEST_CODES the item applies to; absent: every test
#   needs       what the team must send for the item to be checked; absent: nothing beyond the deck
#
# Tolerances are proposals until the cofounder confirms them; the evidence for each is in ADR-0043.

version = "0.1"
status = "draft"  # "confirmed" once the cofounder has agreed the items and tolerances

[[section]]
id = "A"
title = "Identity and traceability"

[[section]]
id = "B"
title = "Model match: our model is the team's model"

[[section]]
id = "C"
title = "Results match: verification against the team's solver"

[[section]]
id = "D"
title = "Physics, independent of both solvers"

[[section]]
id = "E"
title = "Documentation"

# ------------------------------------------------------------------------------------------------- A. Identity and traceability

[[item]]
id = "A1"
section = "A"
check = "The coupon card is complete"
acceptance = "The card names the coupon, its test, the standard, where the size comes from, the team's model, the test data, the material, the layup and the size; none is blank"
method = "auto"
required = true
source = ["spec.coupon_card"]

[[item]]
id = "A2"
section = "A"
check = "The audited files are identified"
acceptance = "The package names the team's deck by its SHA-256 digest, the engine by its commit and our run by its attempt number"
method = "auto"
required = true
source = ["compare.sha256_of", "attempts.latest_attempt"]

[[item]]
id = "A3"
section = "A"
check = "One unit system"
acceptance = "Both decks are read in the unit system the coupon's manifest states, and every number in the audit is in it"
method = "auto"
required = true
source = ["abaqus_reader.read_deck"]

# ------------------------------------------------------------------------------------------------- B. Model match

[[item]]
id = "B1"
section = "B"
check = "Geometry: every node of ours at a node of the team's deck"
acceptance = "The nodes match one to one, each within the tolerance"
method = "auto"
required = true
source = ["equivalence.deck_equivalence"]
tolerance = { length_m = 1e-8 }  # 1e-5 mm: Abaqus/CAE writes coordinates in single precision

[[item]]
id = "B2"
section = "B"
check = "Mesh: element type, count and connectivity"
acceptance = "The same element type and count, every element on the same corner nodes"
method = "auto"
required = true
source = ["equivalence.deck_equivalence"]

[[item]]
id = "B3"
section = "B"
check = "Layup"
acceptance = "The same ply angles in the same order, bottom ply first (ADR-0004), and the same ply count; whether the layup is balanced and symmetric is stated"
method = "auto"
required = true
source = ["equivalence.deck_equivalence"]

[[item]]
id = "B4"
section = "B"
check = "Section: ply thickness, integration points, shell orientation"
acceptance = "The same thickness and number of integration points in every ply, and the same shell orientation"
method = "auto"
required = true
source = ["equivalence.deck_equivalence"]
tolerance = { relative = 1e-9 }  # equivalence.RELATIVE

[[item]]
id = "B5"
section = "B"
check = "Elastic constants"
acceptance = "E1, E2, nu12, G12, G13 and G23 are equal in every ply"
method = "auto"
required = true
source = ["equivalence.deck_equivalence"]
tolerance = { relative = 1e-9 }  # equivalence.RELATIVE

[[item]]
id = "B6"
section = "B"
check = "Material source"
acceptance = "Every elastic constant and strength in our model carries its source and page in the material library, and the auditor agrees it is the material the team meant"
method = "auditor"
required = true

[[item]]
id = "B7"
section = "B"
check = "Grips"
acceptance = "Each coupling has the same reference point, drives the same nodes and constrains the same degrees of freedom"
method = "auto"
required = true
source = ["equivalence.deck_equivalence"]

[[item]]
id = "B8"
section = "B"
check = "Boundary conditions and loads"
acceptance = "Every prescribed degree of freedom is equal, node by node, and the concentrated loads are the same"
method = "auto"
required = true
source = ["equivalence.deck_equivalence"]
tolerance = { relative = 1e-9 }  # equivalence.RELATIVE

[[item]]
id = "B9"
section = "B"
check = "Analysis step"
acceptance = "The same number of steps, each linear static"
method = "auto"
required = true
source = ["equivalence.deck_equivalence"]

# ------------------------------------------------------------------------------------------------- C. Results match

[[item]]
id = "C1"
section = "C"
check = "Total reaction force"
acceptance = "Our reaction at the loaded grip is within the tolerance of the team's"
method = "auto"
required = false  # the cofounder decides whether it is required; the team does not export it today
tolerance = { relative = 0.01 }
needs = "the reaction force at the loaded grip's reference point"

[[item]]
id = "C2"
section = "C"
check = "Ply stresses S11, S22, S12 in material axes"
acceptance = "In the inner band, for every reported element and ply, the difference is within the tolerance of the quantity's largest team value in the band"
method = "auto"
required = true
source = ["side_by_side.pair_reports", "side_by_side.agreement"]
tolerance = { relative = 0.01 }
needs = "field reports of S11, S22 and S12 at every section point"

[[item]]
id = "C3"
section = "C"
check = "Von Mises stress per ply"
acceptance = "As C2, for the von Mises value of each ply's plane stress"
method = "auto"
required = true
source = ["side_by_side.pair_reports", "side_by_side.agreement"]
tolerance = { relative = 0.01 }
needs = "a field report of Mises at every section point"

[[item]]
id = "C4"
section = "C"
check = "Displacement and strain at the gauge centre"
acceptance = "Each component is within the tolerance of the team's largest value of that quantity"
method = "auto"
required = false  # the team does not export U or E today
tolerance = { relative = 0.01 }
needs = "field reports of U and E"

[[item]]
id = "C5"
section = "C"
check = "Regions left out of the comparison"
acceptance = "Every region left out of C2 to C4 was named in the coupon's manifest before the run, with a reason the auditor accepts (a singular corner, a grip end effect)"
method = "auditor"
required = true

[[item]]
id = "C6"
section = "C"
check = "Where the stresses peak"
acceptance = "Both models put each quantity's largest magnitude in the same place, the excluded regions included"
method = "auditor"
required = true
source = ["side_by_side.pair_reports"]

[[item]]
id = "C7"
section = "C"
check = "First-ply failure"
acceptance = "The loading at first-ply failure is within the tolerance of the team's, in the same ply and mode"
method = "auto"
required = false  # the cofounder decides whether it is required; the team does not export failure indices today
tolerance = { relative = 0.01 }
needs = "Abaqus failure indices (MSTRS, TSAIH or TSAIW) at every section point"

# ------------------------------------------------------------------------------------------------- D. Physics

[[item]]
id = "D1"
section = "D"
check = "Laminate theory hand check"
acceptance = "Our strain and ply stresses at the gauge centre equal classical laminate theory for the laminate with free lateral edges"
method = "auto"
required = true
source = ["report.laminate_check"]
tolerance = { relative = 0.005 }
applies_to = ["UNT", "UNC"]

[[item]]
id = "D2"
section = "D"
check = "Equilibrium"
acceptance = "All reactions sum to minus the applied loads (to zero when the grips are displaced), within the tolerance of the reaction at the loaded grip"
method = "auto"
required = true
source = ["results.MembraneSolution.total_reaction"]
tolerance = { relative = 1e-6 }

[[item]]
id = "D3"
section = "D"
check = "Stress at the hole against a closed form"
acceptance = "The stress concentration at the hole edge agrees with the closed form for the laminate"
method = "auto"
required = false  # no closed form for an orthotropic hole is built yet; the isotropic Kirsch check is (fea/checks/open-hole-isotropic-kirsch)
tolerance = { relative = 0.02 }
applies_to = ["OHT"]

[[item]]
id = "D4"
section = "D"
check = "Mesh convergence where the stress peaks"
acceptance = "The peak stress changes by less than the tolerance between the two finest meshes"
method = "auto"
required = false  # not built yet
tolerance = { relative = 0.02 }
applies_to = ["OHT"]

[[item]]
id = "D5"
section = "D"
check = "The results make physical sense"
acceptance = "Signs, symmetry and coupling agree with the layup and the loading: an unbalanced layup shows in-plane shear coupling, a symmetric one no bending"
method = "auditor"
required = true

# ------------------------------------------------------------------------------------------------- E. Documentation

[[item]]
id = "E1"
section = "E"
check = "The document is complete"
acceptance = "Every chapter, table and figure is present and readable"
method = "auditor"
required = true

[[item]]
id = "E2"
section = "E"
check = "The Abaqus/CAE rebuild guide works"
acceptance = "A deck the auditor builds in Abaqus/CAE by following the guide passes B1 to B9 against ours"
method = "auto"
required = false  # the cofounder decides whether every audit includes a rebuild
source = ["equivalence.deck_equivalence"]
needs = "the deck the auditor built from the guide"

[[item]]
id = "E3"
section = "E"
check = "Open and assumed steps"
acceptance = "Every OPEN or ASSUMED step of the rebuild guide has a reason the auditor accepts"
method = "auditor"
required = true

[[item]]
id = "E4"
section = "E"
check = "Claims"
acceptance = "The document says verified for agreement with another solver, and validated only for agreement with test data"
method = "auditor"
required = true
