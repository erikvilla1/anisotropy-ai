# Our coupon models in one folder for the team (docs/models/share.py, ADR-0035 amendment 2). Paths are relative to the
# repository root; the .frd files are local CalculiX runs (run_calculix.py writes them into .local/fea/<test>/runs/calculix).
#   uv run --project fea python docs/models/share.py docs/models/our-models.toml

name = "our-models"
title = "Our coupon models, built the team's way: X840-Z60, [0/45/-45/45/0]s, coupled tabs, the team's names"
units = "mm-MPa"
share = ".local/fea/share/our-models"

[[models]]
test = "tension-coupon"
spec = "fea/models/tension-coupon/tension-coupon.toml"
record = "fea/models/tension-coupon/records/tension-coupon-calculix.toml"
results = ".local/fea/tension-coupon/runs/calculix/tension-coupon-nodal-ccx.frd"

[[models]]
test = "compression-coupon"
spec = "fea/models/compression-coupon/compression-coupon.toml"
record = "fea/models/compression-coupon/records/compression-coupon-calculix.toml"
results = ".local/fea/compression-coupon/runs/calculix/compression-coupon-nodal-ccx.frd"

[[models]]
test = "open-hole-coupon"
spec = "fea/models/open-hole-coupon/open-hole-coupon.toml"
record = "fea/models/open-hole-coupon/records/open-hole-coupon-calculix.toml"
results = ".local/fea/open-hole-coupon/runs/calculix/open-hole-coupon-nodal-ccx.frd"
