[project]
name = "anisotropy-fea"
version = "0.1.0"
description = "Finite element layer for Anisotropy AI: reads the team's Abaqus coupon decks and solves them on the engine's laminate stiffness (ADR-0029)."
requires-python = ">=3.12"
dependencies = [
    "anisotropy-engine==0.1.0",
    "numpy>=2.3",
    "scipy>=1.14",
    "pydantic>=2.11,<3",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8",
]

[tool.uv.sources]
anisotropy-engine = { path = "../engine", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anisotropy_fea"]

[tool.pytest.ini_options]
testpaths = ["tests"]
