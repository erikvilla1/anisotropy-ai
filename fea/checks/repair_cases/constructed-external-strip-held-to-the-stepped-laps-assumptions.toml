title = "Analytical check: the slice of a stepped strip patch, held to the stepped lap's assumptions, returns the stepped lap"
source = "Constructed analytical check, not a printed problem, not a repair of anyone's and not a design: the cross-ply laminate and the strip patch of the engine's case constructed-external-strip-patch-of-another-material, with every Poisson's ratio zero, shear moduli through the thickness ten thousand times the in-plane ones, and every node of the model kept from moving through the thickness. Nothing can then bend, peel or shear through its thickness, each ply stretches along the load alone, and the adhesive only shears: the stepped lap's assumptions (ADR-0130). The expected numbers are the lap's closed form, validation/closed_forms.py `external_patch_repair` in the engine, which uses no engine code. What is left between the two is the adhesive's own stretching along the load, which the lap leaves out and the model has: with E = 2 G = 1800 MPa and 0.2 mm it is about half a percent of an adherend's stiffness, and the tolerance is set by it."
units = "mm-MPa"
kind = "external"

[solve]
hold = "everywhere"      # the check's device (ADR-0132): no node moves through the thickness

[parent]
name = "Constructed ply"
E1 = 140000.0
E2 = 10000.0
G12 = 5000.0
nu12 = 0.0
E3 = 10000.0
G13 = 5.0e7
G23 = 5.0e7
nu13 = 0.0
nu23 = 0.0
ply_thickness = 0.25
layup = [0, 90, 90, 0]

[damage]
diameter = 20.0

[steps]
count = 3
length = 10.0
plies = 2

[patch]
name = "Constructed patch ply"
E1 = 60000.0
E2 = 12000.0
G12 = 4500.0
nu12 = 0.0
E3 = 12000.0
G13 = 4.5e7
G23 = 4.5e7
nu13 = 0.0
nu23 = 0.0
ply_thickness = 0.2
layup = [0, 90, 0, 0, 90, 0]
overlap = 25.0
shape = "strip"

[adhesive]
shear_modulus = 900.0
thickness = 0.2
shear_strength = 28.0
poisson = 0.0

[panel]
length = 240.0
width = 60.0

[applied]
load = 150.0

[expected]
# The lap's closed form. `force_tolerance` is a fraction of the load, `shear_tolerance` a fraction of the largest shear stress.
force_tolerance = 0.005
shear_tolerance = 0.005
boundary_forces = [0.0, 35.0321798723, 55.8641216306, 150.0]
shear_at_ends = [[14.7759872892, 6.70093564964], [6.70093564964, 2.33245581463], [2.33245581463, 33.5467269743]]
peak_shear = 33.5467269743
elastic_limit_load = 125.198503068
