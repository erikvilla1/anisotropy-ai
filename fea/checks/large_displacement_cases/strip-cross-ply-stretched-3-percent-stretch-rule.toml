title = "A [0/90]s laminate's strip stretched 3 %: CalculiX's force is the small-strain law's times (1 + e)(1 + e / 2)"
source = "The stretch rule, worked without the package by fea/tools/large_deflection_closed_forms.py: a strip 100 mm long and 20 mm wide, its ends moved 3 mm apart (e = 0.03), its sides free to narrow; EA = b / a = 1358253 N, with a the entry along the strip of the inverse of the laminate's A, by plain laminate theory (the ply of the bent cross-ply case). CalculiX relates the second Piola-Kirchhoff stress to the Lagrangian strain by the small-strain constants (its manual, *ELASTIC), so the force on an end is EA e (1 + e / 2)(1 + e): 1.04545 times the small-strain law's 40747.59 N at the whole pull, exactly and whatever the Poisson's ratio. The state is uniform, so the mesh does not matter; the tolerance holds what CalculiX's layered bricks add at a laminate's free sides, 1.5 parts in 100,000 of the force with or without the shape followed. Other programs use other rules at such strains (ADR-0142): the case holds CalculiX to the rule it documents, and says nothing of which rule a material follows."

[follow]
first = 0.25
at = [0.5, 1.0]

[small_load]
factor = 0.001
tolerance = 1e-4
kernel_tolerance = 1e-6

[[expected]]
name = "force on the moved end"
what = "reaction"
of = "Edge-Top"
component = 2
values = [20834.49744, 42599.56797]
tolerance = 0.0001

