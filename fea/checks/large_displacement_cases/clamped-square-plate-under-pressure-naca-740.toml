title = "A clamped square plate under pressure, deflected up to 1.9 times its thickness: CalculiX's large-displacement answer follows NACA Report 740"
source = "NACA Report 740 (Samuel Levy, Square plate with clamped edges under normal pressure producing large deflections, 1942; NASA Technical Reports Server 19930091819), Table 5: the centre deflection over the thickness against p a^4 / (E h^4) for a square plate of side a and thickness h with Poisson's ratio 0.316, its edges kept from turning and from moving across themselves and free to slide along themselves, by a double Fourier series solution of von Karman's equations whose error the report estimates below 2 percent. Here a = 200 mm, h = 2 mm, E = 70000 MPa, and the pressure rises to 0.2814 MPa, the table's last row; it presses toward +z. The plate is 16 by 16 eight-node elements: CalculiX's deflection is 0.2 percent below the table at the first row and 2.0 percent below at the last, and moves by less than 0.05 percent from 16 to 32 elements a side, so the difference is not the mesh's. The tolerance holds that difference and no more. The report's stresses are not compared: at the centre CalculiX's membrane stress is about a tenth above the table's and its bending stress about a tenth below, their sum 3 percent below (ADR-0142, open)."

[follow]
first = 0.02
at = [0.04425373134, 0.09527363184, 0.1577114428, 0.236318408, 0.3355721393, 0.4577114428, 0.6094527363, 0.7910447761, 1.0]

[small_load]
factor = 0.001
tolerance = 1e-4
kernel_tolerance = 0.02

[[expected]]
name = "centre deflection over the thickness"
what = "displacement"
of = "centre"
component = 3
scale = 0.5
values = [0.237, 0.471, 0.695, 0.912, 1.121, 1.323, 1.521, 1.714, 1.902]
tolerance = 0.025

