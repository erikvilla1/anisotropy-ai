# How CalculiX reports composite shell results, detected by running it, not assumed (ADR-0030, risk R-18).
# Read by anisotropy_fea.compare when a CalculiX .dat is mapped to our per-ply quantities. Re-run the detection when
# the CalculiX major version changes; the tests in fea/tests/test_calculix.py repeat the detection when ccx is present.

calculix_version = "2.22"
detected_on = "2026-10-15"
detected_by = "Claude Code on the founder's machine, PrePoMax v2.6.0 bundle (C:/Tools/PrePoMax v2.6.0/Solver/ccx_dynamic.exe)"

# *SHELL SECTION, COMPOSITE: the first layer line is the bottom ply (most negative z along the shell normal).
# Seen on the unnotched IM7/8552 [45/0/-45/90]s coupon: the integration points with the lowest z carry the +45 ply's global
# stresses (sxy = +191.9 MPa against the engine's +192.0 for ply 1), the next ones the 0 ply's (sxx = -353.4 against -353.4).
layer_order = "first-line-bottom"

# An S8R composite shell expands to one C3D20R brick with 2 integration points through each layer and 4 in plane
# (reduced integration): 8 plies gave 64 points, 16 z levels, each level holding 4 points.
points_per_layer_thickness = 2
in_plane_points = 4

# *EL PRINT numbers the integration points by z level from the bottom up, 4 in-plane points per level: points 1-4 at the
# lowest level, 5-8 at the next, and so on. Seen with *EL PRINT ... COORD on CalculiX 2.22.
point_order = "z-level ascending, in-plane points consecutive within a level"

# With *EL PRINT, GLOBAL=YES the stresses and strains are in the global axes, and each layer's *ORIENTATION is honoured:
# the +45 and -45 plies print sxy of opposite sign and equal magnitude as the engine predicts.
stress_axes = "global"

# The printed exy is the tensor shear strain: a one-element S8R shell with the exact field u = 0.01 y printed exy = 5.000E-03
# at every point while sxy = 263.16 MPa = G gamma with gamma = 0.01 and the reaction 5263.16 N = tau h w. The engine's
# gamma_xy is twice the printed exy.
shear_strain = "tensor"

# A shell pressure (*DLOAD with the P label) on an S8R element pushes along the element normal, +z for counterclockwise nodes: the opposite
# of the Abaqus P label, which is positive against the normal and which the kernel follows (ADR-0053). Seen on 2026-10-28 (CalculiX 2.22) on
# one isotropic S8R plate, 20 by 10 by 1 mm, E = 70000 MPa, nu = 0.3, clamped along x = 0, under P = 0.01 MPa: the free-edge nodes moved
# w = +2.693197e-02 mm (the kernel's one MITC4 element on the same plate and sign: -3.3495823e-02 mm), and the clamped edge's printed total
# reaction was RFz = -1.666667 N. A CalculiX deck that carries a pressure must therefore write P with the opposite sign of the Abaqus deck.
pressure_label = "P"
pressure_direction = "along the element normal (+z for counterclockwise nodes): opposite to the Abaqus P label"

# The same run applied 0.01 MPa on 200 mm2, 2 N, yet *NODE PRINT, TOTALS=YES on the clamped shell nodes printed 1.666667 N: the totals over
# a set of shell nodes do not hold every force that balances the load (the expanded nodes of the shell's knots carry the rest; the cause is
# UNVERIFIED). A reaction total read from a shell node set is read with that in mind; the kernel's reactions balance the load to roundoff.
shell_set_totals = "may under-report (1.666667 N printed of 2 N applied on the detection plate)"
