# A plastic dog-bone in the size of ASTM D638-14 (ADR-0075): the Type I specimen of Fig. 1, 165 mm long and 19 mm wide, narrowing to 13 mm
# over its 57 mm narrow section with 76 mm fillets; grips 115 mm apart (25 mm at each end) and an extensometer over the 50 mm gage length.
# The material is nominal, not a cited dataset: one isotropic plastic, E = 3000 MPa and nu = 0.35, 3.2 mm thick (Fig. 1 note A's molded
# thickness). In the narrow section the stress is the force over 13 by 3.2 mm, so the extensometer reads E back: the closed form this check is
# held to. Node rows on the grip lines, where the fillets meet the full width and the narrow section, and at the extensometer's ends; an even
# count across puts the extensometer's two nodes on the centre line. Units mm-MPa.
title = "PLASTIC-UNT-L1, unnotched tension: a nominal isotropic plastic as the ASTM D638-14 Type I dog-bone, 3.2 mm thick, nodal grips 115 mm apart, 0.5 mm pull, 50 mm extensometer"
kind = "unnotched_tension"
units = "mm-MPa"

[coupon]
designation = "PLASTIC-UNT-L1"
standard = "none"  # ASTM D638-14 joins the Standard list with the form's dog-bone rows (ADR-0075, part 2); until then the size is cited, not checked
size_from = "ASTM D638-14, Fig. 1: Type I, at its least overall width and length; the 3.2 mm thickness is note A's for a molded specimen"
team_model = "not built yet"
test_data = "none: a public check of the dog-bone and the isotropic material against the closed form and CalculiX"

[geometry]
length = 165.0
width = 19.0
thickness = 3.2
tab_length = 25.0      # (LO - D) / 2 = (165 - 115) / 2
[geometry.dogbone]
narrow_width = 13.0
narrow_length = 57.0
radius = 76.0

[mesh]
mesher = "structured"
element_order = 1
nx = 12                # an even count across: a node column on the centre line, where the extensometer sits
# the grip lines, where each fillet meets the full width (82.5 -/+ 49.642374 mm) and the narrow section (82.5 -/+ 28.5 mm), and the
# extensometer's ends (82.5 -/+ 25 mm)
y_partitions = [25.0, 32.857626, 54.0, 57.5, 107.5, 111.0, 132.142374, 140.0]
y_seeds = [13, 4, 21, 3, 50, 3, 21, 4, 13]  # about 1 mm rows over the fillets and the narrow section; an even count over the gage length

[material]
E = 3000.0
nu = 0.35

[grips]
kind = "nodal"
region = "tabs"

[loading]
control = "displacement"
value = 0.5

[probes]
nodes = { centre = [9.5, 82.5], extensometer_bottom = [9.5, 57.5], extensometer_top = [9.5, 107.5] }
elements = { centre = [9.5, 82.5] }

[strain]
device = "extensometer"
gauge_length = 50.0    # Fig. 1's G for Type I

[output]
fpf_criteria = []
abaqus = { field_preselect = true, node_print = true, el_print = true }
calculix = { node_print = true, el_print = true, frd = true, el_print_global = true }
