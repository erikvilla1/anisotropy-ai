title = "One IM7/8552 element under 1000 N axial load on the top edge: the kernel reproduces the engine's forward solve"
source = "Engine: anisotropy_engine.response.midplane_response(plies, Loads(Ny = 1000 N / 25 mm)) on the deck's plies gives the midplane strain; the two top nodes carry 500 N each, the consistent nodal loads of a uniform edge traction on a four-node element; the bottom edge reaction balances the load. Computed 2026-10-23 for the generic 25 by 100 mm deck (ADR-0042); tests/test_membrane_solve.py recomputes these live."
units = "mm-MPa"

[mesh]
deck = "../decks/coupon-1x1-cload-im7-8552.inp"

[expected]
tolerance = 1e-9
[expected.rf]
"Bottom" = [0.0, -1000.0]
[expected.u]
"Coupon-1.2" = [-0.006699852313089071, 0.0]
"Coupon-1.3" = [-0.023381035167684288, 0.17836012936163134]
"Coupon-1.4" = [-0.016681182854595217, 0.17836012936163134]
[expected.strain]
"*" = [-0.00026799409252356284, 0.0017836012936163134, -0.00016681182854595217]
[expected.section_force]
"*" = [0.0, 40.0, 0.0]

