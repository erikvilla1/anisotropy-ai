title = "One unsymmetric IM7/8552 [0/30/-30/90] element under a prescribed uniform curvature: the flat shell reproduces the engine, B included"
source = "Engine: anisotropy_engine.laminate.abd_matrices on the deck's plies (4 plies, IM7/8552 dataset ncamp-im7-8552-2019-rtd-measured-v1 in MPa) gives A, B and D; with the midplane strain held at zero and kappa = [0.001, 0, 0] 1/mm the laminate law gives N = B kappa and M = D kappa; ply_surfaces(plies, 0, kappa) gives the stress and strain of both faces of every ply in material axes; first_ply_failure(plies, Loads(N, M), criterion, f12_star = 0 as the deck states) gives the ratio, the ply, the face and the mode. The nodal field w = -kappa x^2 / 2, theta_y = kappa x, theta_x = 0, u = v = 0 is the exact pure-bending state, which the MITC4 tying carries with zero transverse shear strain. Computed 2026-10-28; tests/test_shell_solve.py recomputes these live."
units = "mm-MPa"

[mesh]
deck = "../decks/coupon-1x1-bend-im7-8552.inp"

