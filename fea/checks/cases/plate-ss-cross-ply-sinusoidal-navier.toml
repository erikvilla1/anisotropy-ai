title = "A simply supported IM7/8552 [0/90]s plate under a sinusoidal pressure: the shell reproduces Whitney's Navier solution with transverse shear deformation, faces included"
source = "One term of the Navier series with transverse shear deformation (Whitney 1987, Chapter 10, as fea/tools/plate_closed_forms.py states it) for a simply supported 100 mm square specially orthotropic IM7/8552 [0/90]s plate, h = 0.73152 mm (h/a = 0.0073152), under q = 0.01 sin(pi x / a) sin(pi y / a) MPa toward +z; D by hand from the ply constants (D11 = 4689.200896, D12 = 92.90759361, D22 = 921.8955898, D66 = 152.9413091 N mm), transverse shear stiffness 5/6 times the thickness-weighted G13 and G23 (2343.433464 and 2343.433464 N/mm). The Kirchhoff centre deflection, Whitney (5.7) with one term, is 1.60188794 mm; the shear-deformation value is 1.604796284 mm. The ply stresses are Q-bar times z kappa at the centroid of the element nearest the centre, rotated to the fibre axes, on the bottom and top face of each ply. The deck writes the sinusoidal pressure per element as its element average, so the total load is exact; on the 32 by 32 mesh the centre deflection, the quarter-point rotation and the centroid moments, curvatures and ply stresses agree within 0.4 % (the tool's convergence table: 1.3 % on 16 by 16, 5 % on 8 by 8)."
units = "mm-MPa"

