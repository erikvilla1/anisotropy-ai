# X840PW-OHT-L1, our open-hole tension coupon built the way the team builds its coupons (test `open-hole-coupon`): their material X840-Z60
# from the library (Chen 2015, Tables 3.1 and 3.2), their layup [0/45/-45/45/0]s of 0.1 mm plies, the whole tab coupled to a
# reference point at each end, their names. This twin writes the same grips as direct constraints on the tab nodes for CalculiX. Geometry in the proportions of ASTM D5766 (36 mm wide, 6 mm hole, d/w = 1/6;
# 300 mm long with 50 mm tabs), as our earlier IM7/8552 coupon, on the Gmsh transfinite O-grid around the hole. Bottom point
# encastre, top point held in 1, 3, 4, 5, 6 and pulled 1 mm in 2. The team has not built this coupon yet; when they do, mesh
# it as they mesh theirs. Units mm-MPa.
title = "X840PW-OHT-L1, open-hole tension: X840-Z60 plain weave [0/45/-45/45/0]s, 6 mm hole in 36 mm, nodal grips on 50 mm tabs, 1 mm pull (CalculiX twin of the team's build)"
kind = "open_hole_tension"
units = "mm-MPa"

# the identity card (ADR-0038): X840-Z60 plain-weave fabric, open-hole tension, layup L1 = [0/45/-45/45/0]s
[coupon]
designation = "X840PW-OHT-L1"
standard = "none"
size_from = "our design, in the proportions of an ASTM D5766 open-hole tension specimen (36 mm wide, 6 mm hole, 300 mm long, 50 mm tabs)"
team_model = "not built yet"
test_data = "none yet: Chen 2015 tested no open-hole coupons, and its lamina values are the manufacturer's (printed p. 79)"

[geometry]
length = 300.0
width = 36.0
tab_length = 50.0
hole_diameter = 6.0

[mesh]
mesher = "gmsh"
element_order = 1
element_size = 2.0    # the blocks around the hole; the inner square and the arcs follow [mesh.hole]
[mesh.hole]
circumferential = 32  # nodes around the hole, 8 per quarter
radial_layers = 6
ring_ratio = 2.0      # inner square half-side = 2 hole radii = 6 mm
growth = 1.2          # radial element growth away from the hole

[layup]
angles = [0, 45, -45, 45, 0]
symmetric = true
ply_thickness = 0.1

[material]
library = "x840-z60-pw"                 # Chen 2015 (UCSD dissertation), Tables 3.1 and 3.2, printed p. 79
dataset = "chen-2015-x840-z60-pw-v1"
[material.transverse]
G13 = 5100.0        # Table 3.1 (also the team's LAMINA line)
G23 = 4070.0        # Table 3.1 (also the team's LAMINA line)
plane_stress = true  # nu13 = nu23 = 0 for CalculiX, the plane stress Abaqus LAMINA and our kernel assume (ADR-0030, amendment 1)
transverse_isotropy = true   # E3 = E2: a stated choice, used only by CalculiX

[grips]
kind = "nodal"      # the same grips as direct constraints on the tab nodes: what the CalculiX deck needs
region = "tabs"

[loading]
control = "displacement"
value = 1.0

[probes]
nodes = { centre_top = [18.0, 153.0], hole_side = [21.0, 150.0], gauge = [18.0, 100.0] }
elements = { hole_side = [21.2, 150.0], hole_top = [18.0, 153.2], far = [18.0, 100.0] }

[names]             # the team's names, as in Tension-test.inp (ADR-0035, amendment 1)
part = "CFRP-Coupon"
instance = "CFRP-Coupon-1"
material = "X840-Z60"
layup = "CompositeLayup-1"
section_set = "CompositeLayup-1-1"

[output]
fpf_criteria = ["max_stress", "tsai_hill"]   # strengths from Table 3.2; Tsai-Wu would need a stated f12*
abaqus = { field_preselect = true, node_print = true, el_print = true }
calculix = { node_print = true, el_print = true, frd = true, el_print_global = true }
