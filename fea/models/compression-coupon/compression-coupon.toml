# X840PW-UNC-L1, our compression coupon built the way the team builds its coupons (test `compression-coupon`): their material X840-Z60 from
# the library (Chen 2015, Tables 3.1 and 3.2), their layup [0/45/-45/45/0]s of 0.1 mm plies, the whole tab coupled to a
# reference point at each end, their names. Geometry in the proportions of a combined-loading compression test (ASTM D6641
# style: 140 mm by 12 mm, 63.5 mm gripped at each end, 13 mm unsupported gauge), as our earlier IM7/8552 coupon. Bottom point
# encastre, top point held in 1, 3, 4, 5, 6 and moved -0.1 mm in 2. Linear, in-plane only: no buckling of the gauge is modelled.
# The team has not built this coupon yet; when they do, seed the mesh as they seed theirs (mesh.y_partitions, mesh.y_seeds). Units mm-MPa.
title = "X840PW-UNC-L1, unnotched compression: X840-Z60 plain weave [0/45/-45/45/0]s, coupled grips on 63.5 mm tabs, 0.1 mm shortening (the team's build)"
kind = "compression"
units = "mm-MPa"

# the identity card (ADR-0038): X840-Z60 plain-weave fabric, unnotched compression, layup L1 = [0/45/-45/45/0]s
[coupon]
designation = "X840PW-UNC-L1"
standard = "none"
size_from = "our design, in the proportions of an ASTM D6641 combined-loading compression specimen (140 mm by 12 mm, 63.5 mm gripped at each end)"
team_model = "not built yet"
test_data = "none yet: Chen 2015 tested no flat compression coupons, and its lamina values are the manufacturer's (printed p. 79)"

[geometry]
length = 140.0
width = 12.0
tab_length = 63.5

[mesh]
mesher = "structured"
element_order = 1
nx = 12
ny = 280            # 0.5 mm rows: the grip lines at 63.5 and 76.5 mm fall on node rows

[layup]
angles = [0, 45, -45, 45, 0]
symmetric = true
ply_thickness = 0.1

[material]
library = "x840-z60-pw"                 # Chen 2015 (UCSD dissertation), Tables 3.1 and 3.2, printed p. 79
dataset = "chen-2015-x840-z60-pw-v1"
[material.transverse]
G13 = 5100.0        # Table 3.1 (also the team's LAMINA line)
G23 = 4070.0        # Table 3.1 (also the team's LAMINA line)
plane_stress = true  # nu13 = nu23 = 0 for CalculiX, the plane stress Abaqus LAMINA and our kernel assume (ADR-0030, amendment 1)
transverse_isotropy = true   # E3 = E2: a stated choice, used only by CalculiX

[grips]
kind = "coupling"   # reference point at the middle of each end, kinematically coupled to the whole tab, as in the team's deck
region = "tabs"

[loading]
control = "displacement"
value = -0.1

[probes]
nodes = { centre = [6.0, 70.0] }
elements = { centre = [6.25, 70.25] }

[names]             # the team's names, as in Tension-test.inp (ADR-0035, amendment 1)
part = "CFRP-Coupon"
instance = "CFRP-Coupon-1"
material = "X840-Z60"
layup = "CompositeLayup-1"
section_set = "CompositeLayup-1-1"

[output]
fpf_criteria = ["max_stress", "tsai_hill"]   # strengths from Table 3.2; Tsai-Wu would need a stated f12*
abaqus = { field_preselect = true, node_print = true, el_print = true }
calculix = { node_print = true, el_print = true, frd = true, el_print_global = true }
