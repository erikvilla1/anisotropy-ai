# The team's tension coupon (test `tension-coupon`), rebuilt by our generator from their deck and the Abaqus/CAE replay (abaqus.rpy.1):
# 10 mm by 80 mm, 15 mm tabs at each end coupled to a reference point, [0/45/-45/45/0]s of 0.1 mm plies, material X840-Z60
# as entered in CAE (LAMINA: E1 80000, E2 80000, nu12 0.06, G12 6480, G13 5100, G23 4070 MPa), bottom point encastre,
# top point held in 1, 3, 4, 5, 6 and pulled 10 mm in 2, S4R mesh seeded as the team seeded it (10 across, 15/21/8/21/15 along: 800 elements, 891 nodes). Units mm-MPa.
# The material is a licensed reference (Chen 2015, UC San Diego dissertation, Tables 3.1 and 3.2): the spec names the library
# record and the generated deck and document cite it by table and page; nothing from the dissertation is copied (ADR-0018, ADR-0030 amendment 4).
title = "Tension coupon, X840-Z60 [0/45/-45/45/0]s, nodal grips on 15 mm tabs, 10 mm pull (the team's coupon, our generator)"
kind = "unnotched_tension"
units = "mm-MPa"

[geometry]
length = 80.0
width = 10.0
tab_length = 15.0

[mesh]
mesher = "structured"
element_order = 1
nx = 10
y_partitions = [15.0, 35.97, 44.03, 65.0]   # the team's partition lines (their FEA report template, Section 3; Tension-test.inp node rows)
y_seeds = [15, 21, 8, 21, 15]               # element rows per segment, bottom first, as the team seeded it (template Section 10)

[layup]
angles = [0, 45, -45, 45, 0]
symmetric = true
ply_thickness = 0.1

[material]
library = "x840-z60-pw"                 # Chen 2015 (UCSD dissertation), Tables 3.1 and 3.2, printed p. 79: the team's constants, now cited
dataset = "chen-2015-x840-z60-pw-v1"
[material.transverse]
G13 = 5100.0        # Table 3.1 (also the team's LAMINA line)
G23 = 4070.0        # Table 3.1 (also the team's LAMINA line)
plane_stress = true  # nu13 = nu23 = 0 written for CalculiX: its single-brick shell otherwise couples the plies' thickness contraction and raises S22 and RF (not in Abaqus LAMINA, which is plane stress)
transverse_isotropy = true   # E3 = E2: a stated choice, used only by CalculiX

[grips]
kind = "nodal"      # the same grips as direct constraints on the tab nodes: what the CalculiX deck needs
region = "tabs"

[loading]
control = "displacement"
value = 10.0

[probes]
nodes = { centre = [5.0, 40.0] }
elements = { centre = [5.0, 40.0], near_grip = [5.0, 16.0] }

[names]             # the team's names, as in Tension-test.inp, so the deck opens in Abaqus/CAE as their model (ADR-0035, amendment 1)
part = "CFRP-Coupon"
instance = "CFRP-Coupon-1"
material = "X840-Z60"
layup = "CompositeLayup-1"
section_set = "CompositeLayup-1-1"

[output]
fpf_criteria = ["max_stress", "tsai_hill"]   # strengths from Table 3.2; Tsai-Wu would need a stated f12*
abaqus = { field_preselect = true, node_print = true, el_print = true }
calculix = { node_print = true, el_print = true, frd = true, el_print_global = true }
