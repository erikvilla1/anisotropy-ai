title = "One IM7/8552 [0/45/-45/45/0]s element, 1 % axial strain by edge displacement, lateral edges free: the kernel reproduces the engine"
source = "Engine: anisotropy_engine.mixed.mixed_response(plies, {Nx: 0, eps_y: 0.01, Nxy: 0, Mx: 0, My: 0, Mxy: 0}) on the deck's plies (10 plies, IM7/8552 dataset ncamp-im7-8552-2019-rtd-measured-v1 in MPa) gives the midplane strain and Ny; the uniform displacement field u = eps_x x + gamma_xy y, v = eps_y y satisfies the edge conditions; RF = Ny times the 10 mm width. Computed 2026-10-15; tests/test_membrane_solve.py recomputes these live."
units = "mm-MPa"

