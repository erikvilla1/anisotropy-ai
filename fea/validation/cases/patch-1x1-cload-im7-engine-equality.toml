title = "One IM7/8552 element under 1000 N axial load on the top edge: the kernel reproduces the engine's forward solve"
source = "Engine: anisotropy_engine.response.midplane_response(plies, Loads(Ny = 1000 N / 10 mm)) on the deck's plies gives the midplane strain; the two top nodes carry 500 N each, the consistent nodal loads of a uniform edge traction on a four-node element; the bottom edge reaction balances the load. Computed 2026-10-15; tests/test_membrane_solve.py recomputes these live."
units = "mm-MPa"

