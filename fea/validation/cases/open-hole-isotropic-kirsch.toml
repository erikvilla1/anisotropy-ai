title = "Isotropic plate with a small central hole under 100 MPa: Kirsch stress concentration beside the hole, at the top of the hole, at two and at nine and a half radii"
source = "Kirsch's closed form for an infinite isotropic plate with a circular hole of radius a under a far-field stress sigma along y (Timoshenko and Goodier, Theory of Elasticity, chapter 4, the article on the effect of circular holes on stress distributions in plates): sigma_rr = sigma/2 (1 - a^2/r^2) + sigma/2 (1 - 4 a^2/r^2 + 3 a^4/r^4) cos 2 theta, sigma_thth = sigma/2 (1 + a^2/r^2) - sigma/2 (1 + 3 a^4/r^4) cos 2 theta, tau_rth = -sigma/2 (1 + 2 a^2/r^2 - 3 a^4/r^4) sin 2 theta, theta from the loading axis; rotated to plate axes and evaluated at the kernel elements' centroids by fea/tools/kirsch_hole.py (sigma = 12000 N / (120 mm x 1 mm) = 100 MPa, a = 3 mm). The plate is finite (d/w = 0.05, length 3 w) and the kernel's value is a bilinear element's centroid value; the convergence study in docs/evaluations/fea/2026-10-19-gmsh-open-hole.md puts the remaining difference at 1.8 % of sigma beside the hole on this mesh (3.5 % one refinement coarser, 1.0 % one finer), which sets the tolerance."
units = "mm-MPa"

[mesh]
deck = "../decks/generated/open-hole-isotropic-kirsch-abaqus.inp"

[expected]
tolerance = 0.02

# The grips carry the applied 12000 N; the kernel's reactions balance it exactly.
[expected.rf]
"Grip-Bottom" = [0.0, -12000.0]

# One ply at 0 degrees: material axes are the plate axes, so [sigma_1, sigma_2, tau_12] = [sigma_xx, sigma_yy, tau_xy].
# A component written nan is a few percent of sigma in magnitude (the small radial stress beside the hole, the small
# hoop stress at its top, the small transverse stress far out) and is left out: a bilinear element's centroid value does
# not resolve it on this mesh (the differences are below 0.75 % of sigma; the study note shows them), while a relative
# tolerance on a small number would be meaningless. Shear on the two axes of symmetry is exactly zero in the closed form.
[expected.ply_stress_local."Coupon-1.3501"]  # hole_side: centroid (63.0699, 180), r/a 1.02329, theta 90 degrees: sigma_yy approaches 3 sigma
1 = [nan, 284.554, 0.0]
[expected.ply_stress_local."Coupon-1.3813"]  # hole_top: centroid (60, 183.07), r/a 1.02329, theta 0: sigma_xx approaches -sigma
1 = [-89.0536, nan, 0.0]
[expected.ply_stress_local."Coupon-1.3510"]  # ring_side: centroid (65.7397, 180), r/a 1.91325
1 = [29.7832, 124.854, 0.0]
[expected.ply_stress_local."Coupon-1.3536"]  # far_side: centroid (88.5, 180), r/a 9.5: the far field, 0.6 % above sigma in the closed form
1 = [nan, 100.572, 0.0]
