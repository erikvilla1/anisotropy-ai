title = "Example stepped patch repair"
source = "An example made for tests and documents, not a repair of ours or of anyone's, and not a design. Every size is a round value chosen for the example; the ply material comes from the library, and the adhesive's values are round numbers of our own, not a product's. So is nu23, the ply's Poisson's ratio across its fibres, which the library record does not hold: a round value for the example, not a measured property."
units = "mm-MPa"

[parent]
library = "im7-8552"                        # stiffness and cured ply thickness come from the library record
layup = [45, 0, -45, 90, 90, -45, 0, 45]    # degrees from the load, bottom face first
nu23 = 0.45                                 # for the solve of the slice (ADR-0132): a unidirectional ply's constants through the thickness follow from it

[damage]
diameter = 25.0          # mm: the deepest cut

[steps]
count = 4                # the top four plies are cut, one in each step; four are left under the patch
length = 12.5            # mm: each cut is this much wider all round than the one below it

# No [patch]: the patch is the laminate's own material in the angles of the plies removed, [90, -45, 0, 45] from the deepest.

[cover]
layup = [45]             # one ply over the patch
overlap = 12.5           # mm past the widest cut

[adhesive]
shear_modulus = 1000.0   # MPa
thickness = 0.1          # mm
shear_strength = 30.0    # MPa
poisson = 0.35           # for the solve of the slice
peel_strength = 40.0     # MPa: the stress pulling the patch off that the bond can take
peel_energy = 0.5        # N/mm (kJ/m^2): the energy to part a unit area of the bond by pulling it open; with the next, to follow the bond until it lets go (ADR-0137)
shear_energy = 2.0       # N/mm: the same by sliding it

[panel]
length = 300.0           # mm, along the load
width = 200.0

[applied]
load = 100.0             # N/mm of width, tension
