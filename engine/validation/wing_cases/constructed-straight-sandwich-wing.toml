title = "Analytical check: a straight two-spar sandwich wing worked by hand"
source = "Constructed analytical check, not a printed problem and not a design: a wing whose airfoil is a straight-sided section symmetric about the chord line (straight from 15 % to 75 % of the chord, 12.8 % thick at 15 % and 8 % at 75 %), 1.8 m half span, 0.4 m chord, spars at 25 % and 65 %, AS4/3501-6 plies (Daniel & Ishai Table A.4, p. 377; density 1.60 g/cm^3 from the same table), round values for everything else. The closed form is validation/closed_forms.py `straight_sandwich_wing`: the box as one closed cell of four flat walls at their mid-thickness, its shear flow worked wall by wall, Bredt-Batho torsion, Schrenk's lift integrated exactly at the root, standard atmosphere at 2000 m with true airspeeds, the gust load factor of 14 CFR 23.341(c) in consistent units, and the maximum stress criterion on every face of every ply along each wall at the root."
units = "SI"
stations = 401  # the engine integrates the deflection and the twist numerically; the loads are exact at any number

[geometry]
half_span = 1.8
chord = 0.4
front_spar = 0.25
rear_spar = 0.65

[geometry.airfoil]
name = "straight-sided 12.8 % to 8 %"
upper = [[0.0, 0.0], [0.15, 0.064], [0.75, 0.04], [1.0, 0.0]]
lower = [[0.0, 0.0], [0.15, -0.064], [0.75, -0.04], [1.0, 0.0]]

[material]
name = "AS4/3501-6"
E1 = 147.0
E2 = 10.3
G12 = 7.0
nu12 = 0.27
F1t = 2280.0
F1c = 1725.0
F2t = 57.0
F2c = 228.0
F6 = 76.0
ply_thickness = 0.125
density = 1600.0

[skin]
half_stack = [0, 45, -45, 90]
core_thickness = 4.0
core_density = 50.0

[spar]
half_stack = [45, -45, 0]

[aerodynamics]
aerodynamic_center = 0.25
pitching_moment_coefficient = -0.04

[envelope]
gross_weight = 1200.0
positive_load_factor = 3.8
negative_load_factor = -1.52
airspeed = "true"
speed_unit = "m/s"
altitudes = [2000.0]
ultimate_factor = 1.5
criterion = "max_stress"

[envelope.speeds]
cruise = 55.0
positive_maneuver = 48.0

[envelope.gust]
cruise_gust_speed = 15.0
dive_gust_speed = 7.5
lift_curve_slope_per_rad = 5.2
wing_area = 1.44

[envelope.aileron]
span_start = 1.1
span_end = 1.7
down_delta_cl = 0.35
down_delta_cm = -0.07
up_delta_cl = -0.25
up_delta_cm = 0.05
roll_pull_up_fraction = 0.75

[expected]
tolerance = 1e-5  # the deflection and the twist are integrated by the trapezoid rule; everything else is exact

[expected.design]
bending_stiffness = 6740.4027331146535
torsion_stiffness = 7744.052838781273
shear_shares = [0.5948359200564548, 0.3965737011410807]
