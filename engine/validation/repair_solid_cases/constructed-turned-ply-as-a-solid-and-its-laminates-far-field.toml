title = "Analytical check: a ply as a solid turned 30 degrees, and the far field of a laminate of such plies held flat"
source = "Constructed analytical check, not a printed problem: one ply material with nine round constants of our own, different in all three directions; its stiffness as a solid turned 30 degrees about the thickness; the stiffness of that turned ply when it is free through its thickness; and a laminate [0, 30, -30, 90] of 0.2 mm plies under 200 N/mm, held flat, free across its width and kept from shearing, as far from a repair in a solved slice (ADR-0132). The closed form is validation/closed_forms.py `turned_solid_ply`: the orthotropic solid's stiffnesses from its engineering constants and the textbook's term-by-term rotation, with no matrix inverse and no tensor rotation. Stiffnesses are listed in the order 11, 12, 13, 16, 22, 23, 26, 33, 36, 44, 45, 55, 66 (1 = x along the load, 2 = y across the width, 3 = z through the thickness, 4 = yz, 5 = xz, 6 = xy), the reduced ones 11, 12, 22, 16, 26, 66."
units = "mm-MPa"

[material]
name = "Constructed solid ply"
E1 = 60000.0
E2 = 20000.0
E3 = 9000.0
G12 = 5000.0
G13 = 4000.0
G23 = 3000.0
nu12 = 0.25
nu13 = 0.30
nu23 = 0.35
ply_thickness = 0.2

[ply]
angle = 30.0

[laminate]
layup = [0, 30, -30, 90]

[applied]
load = 200.0

[expected]
tolerance = 1e-9
stiffness = [42913.9932607, 16240.5949963, 3832.39475628, 14439.5864644, 22439.9349151, 3770.07939439, 3291.4681815, 9762.74002954, 53.9666864434, 3250.0, 433.012701892, 3750.0, 14654.5536374]
reduced_stiffness = [41409.5744681, 14760.6382979, 20984.0425532, 14418.4016694, 3270.62785472, 14654.2553191]
far_field_strains = [0.0065895637953, -0.00211716307746]
far_field_ply_stress = [392.974991316, 241.62035429, 241.62035429, 123.784300104]
