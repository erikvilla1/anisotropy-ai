title = "IM7/977-3 lamina constants from fiber and matrix at a fiber volume ratio of 0.58 (micromechanics, part c)"
source = "SE142/253A (Fall 2025) Homework 5, Problem 2(c), course solution, numbers only: E1 = 170 GPa, E2 = 7.84 GPa, nu12 = 0.26, G12 = 2.87 GPa at Vf = 0.58. Constituent constants from Daniel and Ishai (2006) Table A.2 p. 375 (IM7) and Table A.3 p. 376 (977-3); models as in the Vf = 0.65 case (rule of mixtures, constrained series model for E2, series model for G12). Which model the course calls hybrid Voigt-Reuss is UNVERIFIED until Lecture Pack 2 is on hand."
units = "SI"

[material]
fiber = {E1 = 290.0, E2 = 21.0, G12 = 14.0, nu12 = 0.20}
matrix = {E = 3.7, nu = 0.35}
Vf = 0.58
E2_model = "series_constrained"
G12_model = "series"

[laminate]
layup = [0]
ply_thickness = 0.125   # nominal, not part of the problem

[applied]
loads = [0, 0, 0, 0, 0, 0]

[expected]
tolerance = 0.015  # the key prints two to three significant figures (0.26 for nu12 = 0.263)
E1 = 170.0    # GPa; rule of mixtures gives 169.75
E2 = 7.84     # GPa; constrained series model gives 7.86
G12 = 2.87    # GPa; series model gives 2.874
nu12 = 0.26   # rule of mixtures gives 0.263
