title = "Stress that compresses a 30-degree lamina by 1% between frictionless rigid walls (Course Reader Problem 3.8, part 1)"
source = "SE142/253A (Fall 2025) Homework 2, Problem 2, course solution; numbers only"
units = "SI"

[material]
E1 = 140.0
E2 = 10.0
G12 = 7.0
nu12 = 0.3

[laminate]
layup = [30]
ply_thickness = 1.0  # not given; these results do not depend on it

[applied.mixed]
# eps_x = -0.01 is imposed; the walls hold eps_y = 0 and, being frictionless, carry no shear.
eps_x = -0.01
eps_y = 0.0
tau_xy = 0.0
Mx = 0.0
My = 0.0
Mxy = 0.0

[expected]
tolerance = 0.002  # the key prints four significant figures
Qbar11 = 86.27  # GPa
Qbar12 = 24.94
Qbar16 = 40.99
Qbar22 = 20.85
Qbar26 = 15.67
Qbar66 = 28.92
Sbar11 = 0.03625  # 1/GPa: the key's 1e-11 m^2/N values times 1e9
Sbar12 = -0.008036
Sbar16 = -0.04701
Sbar22 = 0.08268
Sbar26 = -0.03340
Sbar66 = 0.1193
sigma_x = -282.0  # MPa; the key's sigma_0 = 282 MPa compresses, sigma_x = -sigma_0
