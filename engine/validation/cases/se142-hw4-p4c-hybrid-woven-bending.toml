title = "Hybrid woven/tape laminate under in-plane load, bending and cooling"
source = "SE142/253A (Fall 2025) Homework 4, Problem 4(c), course solution; numbers only"
units = "psi"

[materials.IM7]
# IM7/977-3 unidirectional tape, 0.005 in plies
E1 = 27.7e6
E2 = 1.44e6
G12 = 1.13e6
nu12 = 0.35
alpha1 = -0.5e-6  # 1/degF
alpha2 = 12.4e-6

[materials.AGP370]
# AGP370-5H/3501-6 woven fabric, 0.010 in plies
E1 = 11.2e6
E2 = 10.9e6
G12 = 0.94e6
nu12 = 0.06
alpha1 = 1.9e-6  # 1/degF
alpha2 = 2.1e-6

[laminate]
# [(0)W/0/45/90/-45/90]s, ply 1 at the bottom. The course Excel files repeat ply number 9;
# the second one is ply 8.
plies = [
    {angle = 0, material = "AGP370", thickness = 0.010},
    {angle = 0, material = "IM7", thickness = 0.005},
    {angle = 45, material = "IM7", thickness = 0.005},
    {angle = 90, material = "IM7", thickness = 0.005},
    {angle = -45, material = "IM7", thickness = 0.005},
    {angle = 90, material = "IM7", thickness = 0.005},
    {angle = -45, material = "IM7", thickness = 0.005},
    {angle = 90, material = "IM7", thickness = 0.005},
    {angle = 45, material = "IM7", thickness = 0.005},
    {angle = 0, material = "IM7", thickness = 0.005},
    {angle = 0, material = "AGP370", thickness = 0.010},
]

[applied]
loads = [860.0, 0.0, -250.0, 160.0, 0.0, 0.0]
delta_T = -300.0  # degF

[expected]
tolerance = 0.005  # curvature is printed to three significant figures
strain_global = [1.004e-3, -4.235e-4, -1.325e-3]
curvature = [0.533, -0.0593, -0.164]  # 1/in

# Fiber-axis strain and stress (psi) at the top (+z) face of plies 9 (IM7, 45 deg) and 11 (woven).
[expected.ply_strain_local_top]
9 = [2.333e-3, 6.534e-3, -1.179e-2]
11 = [1.832e-2, -2.351e-3, -6.67e-3]

[expected.ply_stress_local_top]
9 = [6.604e4, 1.597e4, -1.332e4]
11 = [2.112e5, -6.425e3, -6.266e3]
