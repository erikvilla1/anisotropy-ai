title = "E-glass/epoxy lamina constants by the rule of mixtures and Halpin-Tsai with xi = 1, by hand"
source = "Constructed analytical check, computed by hand from Daniel and Ishai (2006) Eqs. 3.23-3.24 (p. 49-50), 3.17 (p. 48), 3.35-3.36 (p. 53) and 3.50 (p. 57) with the constituent constants of Table A.2 p. 375 (E-glass fiber: E = 73 GPa, G = 30 GPa, nu = 0.23) and Table A.3 p. 376 (epoxy 3501-6: E = 4.3 GPa, nu = 0.35, so G = 1.593 GPa) at Vf = 0.55. E1 = 0.55 x 73 + 0.45 x 4.3 = 42.085 GPa; nu12 = 0.55 x 0.23 + 0.45 x 0.35 = 0.284; eta_E2 = (73 - 4.3) / (73 + 4.3) = 0.888745, E2 = 4.3 (1 + 0.888745 x 0.55) / (1 - 0.888745 x 0.55) = 12.524 GPa; eta_G12 = (30 - 1.59259) / (30 + 1.59259) = 0.899178, G12 = 1.59259 (1 + 0.899178 x 0.55) / (1 - 0.899178 x 0.55) = 1.59259 x 2.95686 = 4.7091 GPa. Not a comparison with measured lamina properties."
units = "SI"

[material]
# E-glass is isotropic: E1f = E2f = 73 GPa, G12f = 30 GPa, nu12f = 0.23 (Table A.2).
fiber = {E1 = 73.0, E2 = 73.0, G12 = 30.0, nu12 = 0.23}
matrix = {E = 4.3, nu = 0.35}
Vf = 0.55
E2_model = "halpin_tsai"
G12_model = "halpin_tsai"
xi_E2 = 1.0    # Daniel and Ishai: 1 for hexagonal arrays (glass and carbon at high Vf), 2 for square arrays
xi_G12 = 1.0   # Daniel and Ishai: best agreement for G12

[laminate]
layup = [0]
ply_thickness = 0.125

[applied]
loads = [0, 0, 0, 0, 0, 0]

[expected]
tolerance = 0.0005  # the hand values above carry five significant figures
E1 = 42.085
nu12 = 0.284
E2 = 12.524
G12 = 4.7091
