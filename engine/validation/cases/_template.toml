# Copy this file to a new name (no leading underscore) and fill it in.
# For plies of several materials or thicknesses, use _template-several-materials.toml.
# Files starting with "_" are ignored by the test runner.

title = "What the problem asks, in one line"
source = "Where the answer comes from: book and problem number, or course, homework and problem"
units = "SI"  # "SI" (GPa, MPa, mm, N/m, N*m/m), "US" (Msi, ksi, in, lb/in) or "psi"

[material]
# Or name a cited library dataset instead of typing values (see docs/material-loader-2026-10-10.md):
#   library = "im7-8552"   with an optional   dataset = "nasa-tm-20230001560-im7-8552-rt-measured-v1"
# Then ply_thickness below may be omitted when the dataset records a ply thickness.
E1 = 0.0
E2 = 0.0
G12 = 0.0
nu12 = 0.0
# Strengths are only needed for failure results. Compressive strengths are positive.
# F1t = 0.0
# F1c = 0.0
# F2t = 0.0
# F2c = 0.0
# F6 = 0.0
# Maximum strain needs strain limits as positive fractions, or the stated choice to derive them:
# eps1t = 0.0
# eps1c = 0.0
# eps2t = 0.0
# eps2c = 0.0
# gamma12 = 0.0
# strain_limits = "from-strengths"   # strength divided by modulus (linear to failure); not with the five above
# Thermal expansion is only needed with delta_T: 1/degC (SI) or 1/degF (US, psi). Either may be negative.
# alpha1 = 0.0
# alpha2 = 0.0

[laminate]
layup = [0]          # angles from the bottom face up, counterclockwise from x to the fibers
ply_thickness = 0.0  # same for every ply

[applied]
# Use exactly one of these:
# loads = [Nx, Ny, Nxy, Mx, My, Mxy]
# stress = [sigma_x, sigma_y, tau_xy]               average through the thickness
# strains = [eps_x, eps_y, gamma_xy, kappa_x, kappa_y, kappa_xy]
# local_stress = [sigma_1, sigma_2, tau_12]          single-angle layups only
# local_strain = [eps_1, eps_2, gamma_12]            single-angle layups only
# Or a table [applied.mixed] with one known quantity per pair, the other being solved:
#   Nx or sigma_x or eps_x, Ny or sigma_y or eps_y, Nxy or tau_xy or gamma_xy,
#   Mx or kappa_x, My or kappa_y, Mxy or kappa_xy.
# Optionally add a uniform temperature change next to it (needs alpha1 and alpha2):
# delta_T = 0.0                                      degC (SI) or degF (US, psi)

# Optional first-ply failure search (needs strengths): failure at fixed + R * variable,
# six resultants each; delta_T also stays fixed. Without it, all mechanical loads scale.
# [failure]
# fixed = [0, 0, 0, 0, 0, 0]
# variable = [1, 0, 0, 0, 0, 0]

# Optional plate buckling (symmetric laminate, all edges simply supported):
# [plate]
# a = 0.0                 # along x, in the length unit
# b = 0.0
# edges = "simply-supported"
# [buckling]
# loads = [-1, 0, 0]      # reference [Nx, Ny, Nxy], compression negative; the result is the factor on them
# terms = 7               # Ritz terms per direction; needed unless D16 = D26 = 0 and Nxy = 0

[expected]
tolerance = 0.001  # relative; loosen it to match how the answer key rounds
# Give only the results the answer key states. Available keys:
#   Q11 Q12 Q22 Q66, S11 ... S66 (ply stiffness and compliance in fiber axes)
#   Qbar11 ... Qbar66, Sbar11 ... Sbar66 (one angle: stiffness and compliance in laminate axes)
#   A11 A12 A16 A22 A26 A66, and the same for B and D
#   strain_global, curvature, strain_local, stress_global, stress_local
#   a11 ... a66, b11 ... b66, d11 ... d66 (inverted ABD; the course reader's alpha, beta, delta)
#   ply_strain_global, ply_strain_local, ply_stress_global, ply_stress_local: one [3 values] row
#     per ply, bottom first, at mid-thickness; add _bottom or _top for a face. Or give only some
#     plies as a table keyed by ply number (ply 1 at the bottom): [expected.ply_stress_local_top]
#   N_T, M_T (thermal resultants, with delta_T)
#   Nx Ny Nxy Mx My Mxy, sigma_x sigma_y tau_xy (N/h), eps_x eps_y gamma_xy, kappa_x kappa_y kappa_xy
#   Ex Ey Gxy nu_xy nu_yx
#   fpf_ratio_max_stress, fpf_ratio_tsai_wu (Tsai-Wu also needs f12_star = ... at the top of the file)
#   fpf_forces_max_stress, fpf_moments_max_stress, fpf_ply_max_stress, fpf_z_max_stress (and _tsai_wu)
