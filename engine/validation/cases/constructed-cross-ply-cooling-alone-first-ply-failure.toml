title = "Constructed check: a [0/90]s cross-ply cooled with no load, to first-ply failure by the temperature change alone"
source = "Constructed analytical check, not a printed problem. Elastic constants and strengths: Daniel & Ishai (2006) Table A.4, AS4/3501-6, p. 377; alpha1 and alpha2 are chosen for this check, not taken from a source, as in constructed-cross-ply-cooling-first-ply-failure. Thermal resultants Daniel & Ishai Eqs. 8.16-8.18; with no load the residual stress scales with the temperature change, so the strength ratio is the factor on it. Closed form: engine/validation/closed_forms.py, cross_ply_cooling_alone_first_ply_failure."
units = "SI"
f12_star = -0.5

[material]
E1 = 147.0
E2 = 10.3
G12 = 7.0
nu12 = 0.27
F1t = 2280.0
F1c = 1725.0
F2t = 57.0
F2c = 228.0
F6 = 76.0
alpha1 = -1.0e-6  # 1/degC
alpha2 = 25.0e-6

[laminate]
layup = [0, 90, 90, 0]
ply_thickness = 0.25

[applied]
loads = [0, 0, 0, 0, 0, 0]  # nothing is loaded: the cooling alone stresses the plies
delta_T = -120.0  # degC

[expected]
tolerance = 1e-6
N_T = [-10689.2402, -10689.2402, 0.0]  # N/m
strain_global = [-0.000130596947, -0.000130596947, 0.0]
fpf_ratio_max_stress = 1.965103667  # every ply in transverse tension, 57 / 29.0061 MPa
fpf_ratio_tsai_wu = 1.929525158
fpf_delta_T_max_stress = -235.8124400  # degC: the cooling at which the first ply fails, R * delta_T
fpf_delta_T_tsai_wu = -231.5430189

[expected.ply_stress_local]  # MPa, fiber axes; every ply alike
1 = [-29.0061033, 29.0061033, 0.0]
2 = [-29.0061033, 29.0061033, 0.0]
