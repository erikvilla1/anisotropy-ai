title = "Shear stress that keeps a 45-degree lamina rectangular, its compliance and strains"
source = "SE142/253A (Fall 2025) Homework 2, Problem 1(b)-(c), course solution; numbers only"
units = "SI"

[material]
E1 = 140.0
E2 = 10.0
G12 = 7.0
nu12 = 0.3

[laminate]
layup = [45]
ply_thickness = 1.0  # not given; these results do not depend on it

[applied.mixed]
# sigma_x = sigma_0 and sigma_y = -2 sigma_0 with sigma_0 = 10 MPa; gamma_xy = 0 keeps the panel
# rectangular, and tau_xy is solved. A single ply carries no moments.
sigma_x = 10.0
sigma_y = -20.0
gamma_xy = 0.0
Mx = 0.0
My = 0.0
Mxy = 0.0

[expected]
tolerance = 0.002  # the key prints four significant figures
# Compliances in 1/GPa: the key's m^2/N times 1e9.
S11 = 0.007143
S12 = -0.002143
S22 = 0.1
S66 = 0.1429
Sbar11 = 0.06143
Sbar12 = -0.01
Sbar16 = -0.04643
Sbar22 = 0.06143
Sbar26 = -0.04643
Sbar66 = 0.1114
tau_xy = -4.16  # MPa, part (b)
# Part (c): the key evaluates the strains with the rounded -4.16 MPa, which gives gamma_xy = 1.857e-9;
# with the exact shear stress gamma_xy is zero.
strain_global = [1.008e-3, -1.135e-3, 0]
