title = "Analytical check: a stepped strip patch of another material bonded on top of a cross-ply laminate over a hole"
source = "Constructed analytical check, not a printed problem, not a repair of anyone's and not a design: a laminate of four plies at 0 and 90 degrees, 0.25 mm each, with a 20 mm hole, in a panel 240 mm by 60 mm; on top, a strip patch across the panel's width of six plies at 0 and 90 degrees of a second material, 0.2 mm each, in three steps of two plies and 10 mm, its shortest plies 25 mm past the hole's edge, on a 0.2 mm bondline. Both materials have round constants of our own. The closed form is validation/closed_forms.py `external_patch_repair`; the lap ends at the hole's edge, where the laminate ends and the patch carries the load."
units = "mm-MPa"
kind = "external"

