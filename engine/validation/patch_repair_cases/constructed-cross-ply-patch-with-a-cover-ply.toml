title = "Analytical check: a stepped patch in a cross-ply laminate, three steps of one ply, with one cover ply"
source = "Constructed analytical check, not a printed problem, not a repair of anyone's and not a design: a laminate of six plies at 0 and 90 degrees, 0.2 mm each, of a material with round constants of our own; the top three plies cut in three steps of 10 mm around a 20 mm cut, the patch in the angles of the plies removed, one 0 degree cover ply reaching 15 mm past the widest cut, a 0.1 mm bondline, in a panel 200 mm by 150 mm. The closed form is validation/closed_forms.py `stepped_patch_repair`: sizes, areas and volumes written out from the description, each stack's stiffness as its share of the bonded section's, and the lap by the general solution of each step with no shear stress at the repair's middle."
units = "mm-MPa"

