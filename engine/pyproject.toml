[project]
name = "anisotropy-engine"
version = "0.1.0"
description = "Laminate analysis engine for Anisotropy AI. The only source of numbers in a report."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3",
    "pydantic>=2.11",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anisotropy_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
