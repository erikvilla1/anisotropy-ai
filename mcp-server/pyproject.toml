[project]
name = "anisotropy-mcp"
version = "0.1.0"
description = "Anisotropy's API as tools for a Model Context Protocol client, over stdio on the engineer's own machine."
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27,<1",
]

[project.scripts]
anisotropy-mcp = "anisotropy_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anisotropy_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
