[project]
name = "anisotropy-api"
version = "0.1.0"
description = "Local HTTP interface to the Anisotropy laminate engine."
requires-python = ">=3.12"
dependencies = [
    "anisotropy-engine==0.1.0",
    "fastapi>=0.115,<1",
    "pydantic>=2.11,<3",
    "numpy>=2.3",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.16,<2",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx2"]

[tool.uv.sources]
anisotropy-engine = { path = "../engine", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anisotropy_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
