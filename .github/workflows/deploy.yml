# The hosted tier's deploy (ADR-0056): a merge to main that passed the Tests workflow builds the site with the API at /api, applies
# the migrations to the hosted database and deploys the Worker with its container image; a pull request uploads a preview version
# of the Worker (its code and the site, not a new container image). `workflow_dispatch` deploys main by hand, for the first deploy
# and for a rollout while a Tests job unrelated to the site is red. docs/walkthroughs/hosted-deploy.md explains the pieces and
# how to roll back (`npx wrangler rollback`).
name: Deploy

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  pull_request:

# The actions are pinned to commits (ADR-0114): these jobs hold the Cloudflare and database secrets. The `newest` job reads main's head.
permissions:
  contents: read

jobs:
  # Only main's newest commit is deployed. Each merge runs Tests, and they can finish out of order: on 2026-11-10 the Tests of an older
  # merge finished last, its deploy queued last, cancelled the newer commit's waiting deploy, and the site went out one merge behind.
  # A deploy that is skipped here never enters the deploy-production group, so it cannot cancel the newest one (ADR-0056 amendment 8).
  newest:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      newest: ${{ steps.main.outputs.newest }}
    steps:
      - id: main
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED: ${{ github.event.workflow_run.head_sha }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          echo "main is at $head; this Tests run tested $TESTED"
          if [ "$head" = "$TESTED" ]; then echo "newest=true" >> "$GITHUB_OUTPUT"; else echo "newest=false" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: newest
    if: always() && (github.event_name == 'workflow_dispatch' || (needs.newest.result == 'success' && needs.newest.outputs.newest == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the site with the API at /api on the same origin
        run: npm run build:hosted
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --project api --locked
      - name: Apply the migrations to the hosted database (ADR-0025; the unpooled address when there is one)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: cd api && uv run alembic upgrade head
      - name: Deploy the Worker and its container image
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var ANISOTROPY_GIT_COMMIT:${{ github.event.workflow_run.head_sha || github.sha }}

  # The site as a visitor reaches it, after the deploy (ADR-0114): the home page, the API answering with the commit just deployed, and one
  # public coupon job through the queue to its result. On 2026-11-17 a deploy reached the API only after 20 idle minutes and nothing
  # said so (ADR-0056 amendment 10). Access lets the check in with a service token, two repository secrets; without them it says so.
  check:
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: The site, the API on the deployed commit, and one public coupon job
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -z "$CF_ACCESS_CLIENT_ID" ] || [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "::warning::The check after the deploy did not run: the repository has no CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET secrets (docs/walkthroughs/hosted-deploy.md)"
            echo "The check after the deploy did not run: no service token for Access in the repository's secrets." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 scripts/check-hosted.py --site https://anisotropy.dev --commit "$COMMIT" --values tests/fixtures/studio/values.json

  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:hosted
      - name: Upload a preview version of the Worker (no production traffic, no new container image)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --var ANISOTROPY_GIT_COMMIT:${{ github.event.pull_request.head.sha }}
