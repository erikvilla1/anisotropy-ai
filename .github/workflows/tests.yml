name: Tests

on:
  pull_request:
  push:
    branches: [main]

# Every action is pinned to a commit and Dependabot proposes the updates (ADR-0114); no job here writes to the repository.
permissions:
  contents: read

jobs:
  lint:
    # The Python lint (ADR-0114): the rules are named in ruff.toml, and ruff's version is pinned here so a release cannot change what passes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uvx ruff@0.17.5 check --output-format=github .

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run pytest

  fea:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install CalculiX (the independent reference solver; tests skip with a reason if absent)
        # ccx -v prints the version and exits with code 201, so the step needs the fallback
        run: sudo apt-get update && sudo apt-get install -y calculix-ccx libglu1-mesa && (ccx -v || true)
      - run: uv sync --locked --extra mesh   # Gmsh (the wheel needs libGLU, installed above)
      - run: uv run pytest tests ../engine/tests

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: anisotropy
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: anisotropy_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U anisotropy -d anisotropy_test" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://anisotropy:ci-only@127.0.0.1:5432/anisotropy_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run pytest tests ../engine/tests

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run pytest

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run typecheck:worker

  calculator-browser:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_ANISOTROPY_API_URL: http://127.0.0.1:8000
      BROWSER_CHANNEL: chromium
      # The browser test's API has no database; recording is switched off on purpose (ADR-0026).
      ANISOTROPY_RUN_RECORDS: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: npm ci
      - run: uv sync --project api --locked
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:calculator

  studio-browser:
    runs-on: ubuntu-latest
    env:
      # The studio test plays the API from tests/fixtures/studio by route interception, so any address will do (ADR-0051).
      NEXT_PUBLIC_ANISOTROPY_API_URL: http://127.0.0.1:8000
      BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:studio

  site-browser:
    # Every browser spec the jobs above do not run (ADR-0114): the public pages, the home page's demo, the shell, the libraries and every
    # page on a phone. playwright.site.config.ts takes any spec no other configuration claims, so a new spec file is never left out.
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_ANISOTROPY_API_URL: http://127.0.0.1:8000
      BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: site-browser-results
          path: test-results/
          retention-days: 7

  other-browsers:
    # The site's and the workspace's browser specs in Firefox and in WebKit, the engine of Safari and of every browser on an iPhone
    # (ADR-0114); the jobs above run them in Chromium. The phone check is an iPhone in WebKit.
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 40 # an install that hangs on the runner's package mirror stops here, not at GitHub's six hours
    env:
      NEXT_PUBLIC_ANISOTROPY_API_URL: http://127.0.0.1:8000
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      # On a virtual display: Firefox runs with its window, as without one it gives no WebGL (playwright.config.ts). WebKit needs none.
      - name: The site's specs
        run: xvfb-run -a npm run test:site
      - name: The workspace's specs, with the API played from tests/fixtures/studio
        if: success() || failure()
        run: xvfb-run -a npm run test:studio
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ${{ matrix.browser }}-results
          path: test-results/
          retention-days: 7

  image:
    # The solver image (ADR-0056): built from the Dockerfile, then CalculiX, Gmsh and one public coupon job through the API
    # inside it, all with the network off, so the image proves it needs nothing it does not carry (docker/README.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build --build-arg GIT_COMMIT=$GITHUB_SHA -t anisotropy-solver:ci .
      - name: Image size
        run: "docker image inspect anisotropy-solver:ci --format 'Image size: {{.Size}} bytes'"
      - name: CalculiX and Gmsh inside the image, network off (ccx -v exits with code 201, so its line needs the fallback)
        run: |
          docker run --rm --network none anisotropy-solver:ci ccx -v | tee ccx-version.txt || true
          grep -q "Version" ccx-version.txt
          docker run --rm --network none anisotropy-solver:ci /app/fea/.venv/bin/python -c "import gmsh; print('Gmsh', gmsh.__version__)"
          docker run --rm --network none anisotropy-solver:ci tectonic --version
      - name: One public coupon job through the API, network off, to its package with the PDF
        run: |
          docker run -d --name api --network none -e ANISOTROPY_RUN_RECORDS=off \
            -v "$PWD/tests/fixtures/studio/values.json:/check/values.json:ro" \
            -v "$PWD/docker/check-image.py:/check/check-image.py:ro" anisotropy-solver:ci
          docker exec api /app/api/.venv/bin/python /check/check-image.py --values /check/values.json --summary /tmp/summary.json
      - name: The document of a model sent from Abaqus, network off, from a public comparison (ADR-0094 step 7)
        run: |
          docker run --rm --network none -v "$PWD/tests/fixtures/abaqus:/check/abaqus:ro" anisotropy-solver:ci sh -c \
            '/app/fea/.venv/bin/python /app/docs/models/upload.py /check/abaqus/another-mesh.json --out /tmp/upload-document && test -s /tmp/upload-document/comparison.pdf && ls -l /tmp/upload-document/comparison.pdf'
      - name: The API's log and the container's end
        if: always()
        run: |
          docker logs api || true
          docker rm -f api || true

  worker-run:
    # The change as the hosted tier runs it (ADR-0114): the Worker, the site built for /api and both containers from this Dockerfile,
    # under `wrangler dev` with the local queue, PostgreSQL and an S3 stand-in for R2; then the deploy's own check and the studio's live
    # browser run against it. The preview version Deploy uploads for a pull request has no address (Cloudflare gives none to a Worker
    # with Durable Objects), so this is where the pull request's Worker and image are run together before a merge deploys them.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: anisotropy
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: anisotropy_worker
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U anisotropy -d anisotropy_worker" --health-interval 5s --health-retries 10
    env:
      WRANGLER_SEND_METRICS: "false"
      BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: npm ci
      - run: uv sync --project api --locked
      - name: The database's tables, and an S3 stand-in with its bucket
        run: |
          (cd api && DATABASE_URL=postgresql://anisotropy:ci-only@127.0.0.1:5432/anisotropy_worker uv run alembic upgrade head)
          nohup uv run --project api moto_server -H 0.0.0.0 -p 9000 > moto.log 2>&1 &
          for i in $(seq 30); do curl -sf http://127.0.0.1:9000/ > /dev/null && break; sleep 1; done
          uv run --project api python -c "import boto3; boto3.client('s3', endpoint_url='http://127.0.0.1:9000', region_name='us-east-1', aws_access_key_id='ci-only', aws_secret_access_key='ci-only').create_bucket(Bucket='anisotropy-ci')"
      - run: npm run build:hosted
      - name: The Worker under wrangler dev, its containers reaching the database and the store through Docker's bridge
        run: |
          {
            echo "DATABASE_URL=postgresql://anisotropy:ci-only@172.17.0.1:5432/anisotropy_worker"
            echo "ANISOTROPY_R2_BUCKET=anisotropy-ci"
            echo "ANISOTROPY_R2_ENDPOINT=http://172.17.0.1:9000"
            echo "ANISOTROPY_R2_ACCESS_KEY_ID=ci-only"
            echo "ANISOTROPY_R2_SECRET_ACCESS_KEY=ci-only"
            echo "ANISOTROPY_GIT_COMMIT=$GITHUB_SHA"
          } > .dev.vars
          nohup npx wrangler dev --ip 127.0.0.1 --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 900); do grep -q "Ready on" wrangler.log && break; sleep 1; done
          grep -q "Ready on" wrangler.log
      - name: The deploy's check against it (the site, the API on this commit, one public coupon job through the queue)
        run: python3 scripts/check-hosted.py --site http://127.0.0.1:8787 --commit "$GITHUB_SHA" --values tests/fixtures/studio/values.json --wait 900
      - run: npx playwright install --with-deps chromium
      - name: The studio's live browser run, the public example end to end through the Worker
        run: npm run test:studio-live
        env:
          PREVIEW_URL: http://127.0.0.1:8787
      - name: The Worker's log and the containers' logs
        if: always()
        run: |
          tail -n 200 wrangler.log || true
          for c in $(docker ps -aq); do echo "=== $(docker inspect -f '{{.Name}} {{.Config.Image}}' $c)"; docker logs --tail 80 $c 2>&1; done
          tail -n 40 moto.log || true

  manual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install Tectonic
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install CalculiX and libGLU, as the fea job does (the manual's build runs the fea tests, which need the solver and Gmsh)
        run: sudo apt-get update && sudo apt-get install -y calculix-ccx libglu1-mesa && (ccx -v || true)
      - run: uv run --project fea --extra mesh python docs/manual/build.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-manual
          path: docs/manual/build/anisotropy-engine-manual.pdf
      - name: Build one document per check record (ADR-0031; the open-hole model is meshed by Gmsh). The coupon documents are local (ADR-0042)
        run: |
          sudo apt-get update && sudo apt-get install -y libglu1-mesa
          uv run --project fea --extra mesh python docs/models/build.py --all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: model-documents
          path: docs/models/build/*/*.pdf
      - name: Build one document per solved problem (ADR-0033)
        run: uv run --project fea python docs/problems/build.py --all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: problem-documents
          path: |
            docs/problems/build/*/*.pdf
            docs/problems/build/index.md
